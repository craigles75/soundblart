        }

            transform: scale(0.96);

<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-[#0e0e0e] flex items-center justify-between px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="text-[#ff8f6f] hover:bg-[#262626] transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-['Space_Grotesk'] font-bold text-[#ff8f6f] text-xl tracking-tight">Sonic Atelier</h1>
</div>
<div class="flex items-center gap-2">
<div class="hidden md:flex gap-6 mr-8">
<a class="text-[#ff8f6f] font-['Space_Grotesk'] font-medium" href="#">Studio</a>
<a class="text-[#484847] font-['Space_Grotesk'] font-medium hover:text-[#ff8f6f] transition-colors" href="#">Library</a>
<a class="text-[#484847] font-['Space_Grotesk'] font-medium hover:text-[#ff8f6f] transition-colors" href="#">Folders</a>
</div>
<button class="text-[#ff8f6f] hover:bg-[#262626] transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<main class="flex-grow container mx-auto px-6 py-8 md:py-12 max-w-6xl mb-24">
<!-- Dashboard Header -->
<div class="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6">
<div>
<span class="text-on-surface-variant font-label text-[0.6875rem] uppercase tracking-[0.2em] mb-2 block">Live Session</span>
<h2 class="font-headline text-5xl md:text-7xl font-bold tracking-tighter">Audience <span class="text-primary">Impact</span></h2>
</div>
<div class="flex gap-3">
<div class="bg-surface-container-highest px-4 py-2 rounded-full flex items-center gap-2">
<div class="w-2 h-2 bg-secondary rounded-full animate-pulse"></div>
<span class="text-sm font-medium">Live Output</span>
</div>
<button class="bg-surface-container-highest p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="more_vert">more_vert</span>
</button>
</div>
</div>
<!-- Bento Grid / Soundboard -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-6 md:gap-8">
<!-- Pad 1: Clapping -->
<button class="sound-pad group relative aspect-square md:aspect-auto md:h-64 rounded-lg overflow-hidden bg-gradient-to-br from-primary to-primary-container p-6 flex flex-col justify-between items-start text-left">
<div class="w-full flex justify-between items-start">
<span class="material-symbols-outlined text-on-primary-fixed text-3xl" data-icon="clapping_hands">waving_hand</span>
<span class="text-on-primary-fixed/40 font-mono text-xs">01</span>
</div>
<div>
<h3 class="font-headline text-2xl md:text-3xl font-bold text-on-primary-fixed leading-none mb-1">Clapping</h3>
<p class="font-label text-[10px] uppercase tracking-widest text-on-primary-fixed/60">Stadium Crowd</p>
</div>
<div class="absolute bottom-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-primary-fixed" data-icon="play_arrow">play_arrow</span>
</div>
</button>
<!-- Pad 2: Cheering -->
<button class="sound-pad group relative aspect-square md:aspect-auto md:h-64 rounded-lg overflow-hidden bg-gradient-to-br from-primary to-primary-container p-6 flex flex-col justify-between items-start text-left">
<div class="w-full flex justify-between items-start">
<span class="material-symbols-outlined text-on-primary-fixed text-3xl" data-icon="celebration">celebration</span>
<span class="text-on-primary-fixed/40 font-mono text-xs">02</span>
</div>
<div>
<h3 class="font-headline text-2xl md:text-3xl font-bold text-on-primary-fixed leading-none mb-1">Cheering</h3>
<p class="font-label text-[10px] uppercase tracking-widest text-on-primary-fixed/60">High Energy</p>
</div>
<div class="absolute bottom-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-primary-fixed" data-icon="play_arrow">play_arrow</span>
</div>
</button>
<!-- Pad 3: Booing -->
<button class="sound-pad group relative aspect-square md:aspect-auto md:h-64 rounded-lg overflow-hidden bg-gradient-to-br from-primary to-primary-container p-6 flex flex-col justify-between items-start text-left">
<div class="w-full flex justify-between items-start">
<span class="material-symbols-outlined text-on-primary-fixed text-3xl" data-icon="thumb_down">thumb_down</span>
<span class="text-on-primary-fixed/40 font-mono text-xs">03</span>
</div>
<div>
<h3 class="font-headline text-2xl md:text-3xl font-bold text-on-primary-fixed leading-none mb-1">Booing</h3>
<p class="font-label text-[10px] uppercase tracking-widest text-on-primary-fixed/60">Mass Disapproval</p>
</div>
<div class="absolute bottom-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-primary-fixed" data-icon="play_arrow">play_arrow</span>
</div>
</button>
<!-- Pad 4: Laughter -->
<button class="sound-pad group relative aspect-square md:aspect-auto md:h-64 rounded-lg overflow-hidden bg-gradient-to-br from-primary to-primary-container p-6 flex flex-col justify-between items-start text-left">
<div class="w-full flex justify-between items-start">
<span class="material-symbols-outlined text-on-primary-fixed text-3xl" data-icon="sentiment_very_satisfied">sentiment_very_satisfied</span>
<span class="text-on-primary-fixed/40 font-mono text-xs">04</span>
</div>
<div>
<h3 class="font-headline text-2xl md:text-3xl font-bold text-on-primary-fixed leading-none mb-1">Laughter</h3>

<span class="material-symbols-outlined text-on-primary-fixed" data-icon="play_arrow">play_arrow</span>
</div>
</button>
<!-- Pad 5: Whistle -->
<button class="sound-pad group relative aspect-square md:aspect-auto md:h-64 rounded-lg overflow-hidden bg-gradient-to-br from-primary to-primary-container p-6 flex flex-col justify-between items-start text-left">
<div class="w-full flex justify-between items-start">
<span class="material-symbols-outlined text-on-primary-fixed text-3xl" data-icon="sports">sports</span>
<span class="text-on-primary-fixed/40 font-mono text-xs">05</span>
</div>
<div>

<span class="material-symbols-outlined text-on-primary-fixed" data-icon="play_arrow">play_arrow</span>

<button class="sound-pad group relative aspect-square md:aspect-auto md:h-64 rounded-lg overflow-hidden bg-gradient-to-br from-primary to-primary-container p-6 flex flex-col justify-between items-start text-left">
<div class="w-full flex justify-between items-start">
<span class="material-symbols-outlined text-on-primary-fixed text-3xl" data-icon="tide">waves</span>
<span class="text-on-primary-fixed/40 font-mono text-xs">06</span>
</div>
<div>
<h3 class="font-headline text-2xl md:text-3xl font-bold text-on-primary-fixed leading-none mb-1">Gasp</h3>

<div class="absolute bottom-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-primary-fixed" data-icon="play_arrow">play_arrow</span>

</div>

<div class="col-span-1 md:col-span-2">

<div class="space-y-2">
<div class="flex justify-between font-label text-[10px] uppercase tracking-widest text-on-surface-variant">

</div>
<div class="h-2 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-3/4 rounded-full"></div>
</div>
</div>
<div class="space-y-2">

<span class="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Visualizer Active</span>

<a class="flex flex-col items-center justify-center text-[#484847] hover:text-white transition-all active:scale-90 duration-150" href="#">

<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium uppercase tracking-widest mt-1">Library</span>

<a class="flex flex-col items-center justify-center text-[#484847] hover:text-white transition-all active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="folder_open">folder_open</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-medium uppercase tracking-widest mt-1">Folders</span>
