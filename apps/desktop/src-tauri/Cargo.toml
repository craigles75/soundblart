[package]
name = "soundblart"
version = "0.1.0"
description = "Soundblart — a tactile soundboard for meetings, streaming, and podcasting"
authors = ["Soundblart"]
license = "MIT"
repository = "https://github.com/soundblart/soundblart"
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "soundblart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "soundblart"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = ["protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"

kira      = { version = "0.9", features = ["cpal"] }
symphonia = { version = "0.5", features = ["wav", "pcm"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
log        = "0.4"
chrono     = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"   # smaller binary, no unwinding tables
codegen-units = 1 # maximise optimisations
lto = true
opt-level = "s"   # size; switch to 3 for pure speed

[profile.dev]
incremental = true
